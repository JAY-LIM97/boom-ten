<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0E27" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Planet 2048" />
  <meta name="description" content="유성에서 은하까지! 같은 행성을 합쳐라! 물리 기반 행성 합체 퍼즐" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/icon.svg" />

  <title>Planet 2048 - 행성 합체 퍼즐</title>

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Matter.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ─── CSS Variables / Theme ─────────────────────────── */
    :root {
      --color-bg:           #0A0E27;
      --color-surface:      #12183A;
      --color-surface-2:    #1A2250;
      --color-border:       #2A3570;
      --color-accent-a:     #FF6B35;  /* orange */
      --color-accent-b:     #9B5DE5;  /* purple */
      --color-accent-c:     #00D4FF;  /* cyan */
      --color-success:      #00FF88;
      --color-danger:       #FF3860;
      --color-text:         #E8EEFF;
      --color-text-muted:   #7A8AB8;
      --hud-height:         56px;
      --ad-height:          50px;
      --safe-top:           env(safe-area-inset-top, 0px);
      --safe-bottom:        env(safe-area-inset-bottom, 0px);
      --safe-left:          env(safe-area-inset-left, 0px);
      --safe-right:         env(safe-area-inset-right, 0px);
    }

    /* ─── Base Reset ────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      height: 100dvh;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR',
                   'Apple SD Gothic Neo', sans-serif;
      touch-action: manipulation;
      overscroll-behavior: none;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ─── Gradient Text ─────────────────────────────────── */
    .gradient-text {
      background: linear-gradient(135deg, var(--color-accent-a) 0%, var(--color-accent-b) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .gradient-text-cyan {
      background: linear-gradient(135deg, var(--color-accent-c) 0%, var(--color-accent-b) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ─── Keyframe Animations ───────────────────────────── */
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 53, 0); }
      50%       { opacity: 0.85; transform: scale(1.04); box-shadow: 0 0 20px 6px rgba(255, 107, 53, 0.4); }
    }

    @keyframes float-up {
      0%   { opacity: 0; transform: translateY(20px) scale(0.8); }
      30%  { opacity: 1; transform: translateY(0)    scale(1); }
      70%  { opacity: 1; transform: translateY(0)    scale(1); }
      100% { opacity: 0; transform: translateY(-20px) scale(0.9); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes danger-pulse {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.8; }
    }

    @keyframes score-pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    @keyframes star-twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1.2); }
    }

    @keyframes logo-bounce {
      0%   { transform: translateY(0) rotate(-1deg); }
      50%  { transform: translateY(-8px) rotate(1deg); }
      100% { transform: translateY(0) rotate(-1deg); }
    }

    /* ─── Utility Classes ───────────────────────────────── */
    .pulse-btn {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .logo-bounce {
      animation: logo-bounce 3s ease-in-out infinite;
      display: inline-block;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .screen.hidden {
      display: none;
    }

    /* ─── Stars Background ──────────────────────────────── */
    .stars-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: white;
      animation: star-twinkle linear infinite;
    }

    /* ─── Splash Screen ─────────────────────────────────── */
    #splash-screen {
      background: radial-gradient(ellipse at 30% 20%, #1A1060 0%, #0A0E27 60%);
      z-index: 100;
    }

    .splash-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 24px 32px;
      animation: fade-in 0.6s ease both;
    }

    .splash-logo-wrapper {
      position: relative;
      margin-bottom: 8px;
    }

    .splash-logo-glow {
      position: absolute;
      inset: -20px;
      background: radial-gradient(ellipse, rgba(155, 93, 229, 0.25) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .splash-logo {
      font-size: clamp(3.5rem, 16vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      text-shadow: 0 4px 40px rgba(255, 107, 53, 0.3);
    }

    .splash-subtitle {
      font-size: clamp(0.8rem, 3.5vw, 1rem);
      color: var(--color-text-muted);
      margin-bottom: 40px;
      margin-top: 8px;
      letter-spacing: 0.03em;
    }

    .tap-to-start {
      position: relative;
      padding: 14px 40px;
      border-radius: 50px;
      font-size: clamp(0.9rem, 4vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      color: white;
      background: linear-gradient(135deg, var(--color-accent-a), var(--color-accent-b));
      border: none;
      cursor: pointer;
      outline: none;
      animation: pulse-glow 2s ease-in-out infinite;
      transition: transform 0.15s ease;
    }

    .tap-to-start:active {
      transform: scale(0.96);
      animation: none;
    }

    .splash-version {
      position: absolute;
      bottom: calc(16px + var(--safe-bottom));
      font-size: 0.7rem;
      color: var(--color-text-muted);
      opacity: 0.5;
    }

    /* ─── Decorative orbs ───────────────────────────────── */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      opacity: 0.18;
    }

    /* ─── Game Screen ───────────────────────────────────── */
    #game-screen {
      justify-content: flex-start;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    /* ─── HUD ───────────────────────────────────────────── */
    #game-hud {
      width: 100%;
      max-width: 480px;
      height: var(--hud-height);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: rgba(18, 24, 58, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
      position: relative;
      z-index: 10;
    }

    .hud-score-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 80px;
    }

    .hud-label {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    #hud-score {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--color-text);
      line-height: 1;
      transition: transform 0.15s ease;
      font-variant-numeric: tabular-nums;
    }

    #hud-score.pop {
      animation: score-pop 0.3s ease;
    }

    /* Combo display */
    #hud-combo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
    }

    #hud-combo {
      font-size: 1.3rem;
      font-weight: 900;
      line-height: 1;
    }

    #hud-combo-label {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    .combo-0  { color: var(--color-text-muted); }
    .combo-1  { color: #aabbff; }
    .combo-3  { color: var(--color-accent-c); }
    .combo-5  { color: var(--color-accent-a); }
    .combo-10 { color: var(--color-success); }

    /* Pause button */
    #btn-pause {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-text-muted);
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    #btn-pause:active {
      background: var(--color-border);
      color: var(--color-text);
    }

    /* ─── Canvas Container ──────────────────────────────── */
    #canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* ─── Next Ball Preview ────────────────────────────── */
    #hud-next-ball {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1rem;
      color: white;
      background: #FF6B6B;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: background 0.2s ease, transform 0.15s ease;
    }

    #hud-next-ball.pop {
      animation: score-pop 0.3s ease;
    }

    /* ─── Danger Zone Line ──────────────────────────────── */
    #danger-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      top: 15%;
      z-index: 5;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 56, 96, 0.6) 20%, rgba(255, 56, 96, 0.8) 50%, rgba(255, 56, 96, 0.6) 80%, transparent 100%);
      animation: danger-pulse 1.8s ease-in-out infinite;
      pointer-events: none;
    }

    #danger-line::before {
      content: 'DANGER';
      position: absolute;
      right: 8px;
      top: -10px;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(255, 56, 96, 0.7);
    }

    /* ─── Ad Banner ─────────────────────────────────────── */
    #ad-banner {
      width: 100%;
      max-width: 480px;
      height: var(--ad-height);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 14, 39, 0.9);
      border-top: 1px solid var(--color-border);
      position: relative;
      z-index: 10;
    }

    /* ─── Game Over Screen ──────────────────────────────── */
    #gameover-screen {
      z-index: 90;
      background: rgba(10, 14, 39, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .gameover-card {
      width: min(380px, 90vw);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 24px;
      padding: 32px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(155, 93, 229, 0.15);
      animation: slide-up 0.4s ease both;
      position: relative;
      overflow: hidden;
    }

    .gameover-card::before {
      content: '';
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 120px;
      background: radial-gradient(ellipse, rgba(155, 93, 229, 0.2) 0%, transparent 70%);
      pointer-events: none;
    }

    .gameover-title {
      font-size: clamp(2rem, 9vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .gameover-subtitle {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-bottom: 28px;
      letter-spacing: 0.08em;
    }

    .score-display-block {
      width: 100%;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .score-display-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    .score-display-value {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .best-display-block {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(155, 93, 229, 0.08);
      border: 1px solid rgba(155, 93, 229, 0.2);
      margin-bottom: 24px;
    }

    .best-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--color-accent-b);
      text-transform: uppercase;
    }

    .best-value {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--color-accent-b);
      font-variant-numeric: tabular-nums;
    }

    .gameover-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-primary {
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: white;
      background: linear-gradient(135deg, var(--color-accent-a), var(--color-accent-b));
      border: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease, opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:active { transform: scale(0.97); opacity: 0.9; }

    .btn-secondary {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--color-text);
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease, background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary:active { transform: scale(0.97); background: var(--color-border); }

    .btn-ad {
      background: linear-gradient(135deg, #1a6635, #0d4422);
      border-color: #2aad55;
    }

    .btn-ad-label {
      font-size: 0.65rem;
      opacity: 0.75;
      display: block;
      line-height: 1;
      margin-top: 2px;
    }

    /* ─── Pause Modal ───────────────────────────────────── */
    #pause-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(10, 14, 39, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #pause-modal.hidden { display: none; }

    .pause-card {
      width: min(320px, 86vw);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 24px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: slide-up 0.3s ease both;
    }

    .pause-title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      margin-bottom: 24px;
    }

    .pause-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-sound-toggle {
      width: 100%;
      padding: 13px 20px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-text-muted);
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-sound-toggle:active { background: var(--color-border); }

    /* ─── Desktop Sidebar Ads ───────────────────────────── */
    #sidebar-left,
    #sidebar-right {
      display: none;
    }

    @media (min-width: 1024px) {
      #sidebar-left,
      #sidebar-right {
        display: flex;
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        width: 160px;
        height: 600px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        align-items: center;
        justify-content: center;
        z-index: 5;
        flex-direction: column;
        gap: 8px;
      }

      #sidebar-left  { left: calc(50% - 240px - 180px); }
      #sidebar-right { right: calc(50% - 240px - 180px); }

      .sidebar-label {
        font-size: 0.65rem;
        color: var(--color-border);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        writing-mode: vertical-lr;
        transform: rotate(180deg);
      }

      #game-screen {
        align-items: center;
      }
    }

    /* ─── Floating Score Popup ──────────────────────────── */
    .float-score {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--color-success);
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
      animation: float-up 1.2s ease forwards;
      z-index: 30;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    /* ─── Notification Toast ────────────────────────────── */
    #toast-container {
      position: fixed;
      top: calc(var(--hud-height) + var(--safe-top) + 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      align-items: center;
    }

    .toast {
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      color: white;
      background: rgba(26, 34, 80, 0.95);
      border: 1px solid var(--color-border);
      backdrop-filter: blur(10px);
      animation: float-up 1.6s ease forwards;
      white-space: nowrap;
    }

    /* ─── Loading indicator ─────────────────────────────── */
    #loading-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--color-accent-a), var(--color-accent-b));
      z-index: 9999;
      transition: width 0.3s ease;
      width: 0%;
    }
  </style>

  <!-- Tailwind config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              900: '#0A0E27',
              800: '#12183A',
              700: '#1A2250',
              600: '#2A3570',
            },
            accent: {
              orange: '#FF6B35',
              purple: '#9B5DE5',
              cyan:   '#00D4FF',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-[#0A0E27] overflow-hidden select-none" style="touch-action: manipulation; overscroll-behavior: none;">

  <!-- Loading bar -->
  <div id="loading-bar"></div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- ════════════════════════════════════════════════════
       DESKTOP SIDEBAR AD PLACEHOLDERS (1024px+) — 주석처리: 추후 광고 삽입 시 복원
  ═════════════════════════════════════════════════════ -->
  <!--
  <div id="sidebar-left" aria-label="광고 영역">
    <span class="sidebar-label">AD · 160×600</span>
  </div>
  <div id="sidebar-right" aria-label="광고 영역">
    <span class="sidebar-label">AD · 160×600</span>
  </div>
  -->

  <!-- ════════════════════════════════════════════════════
       SPLASH SCREEN
  ═════════════════════════════════════════════════════ -->
  <div id="splash-screen" class="screen">

    <!-- Starfield background -->
    <div class="stars-bg" id="stars-bg" aria-hidden="true"></div>

    <!-- Decorative ambient orbs -->
    <div class="orb" style="width:300px;height:300px;background:var(--color-accent-b);top:-80px;right:-60px;"></div>
    <div class="orb" style="width:250px;height:250px;background:var(--color-accent-a);bottom:-60px;left:-40px;"></div>

    <div class="splash-content">

      <!-- Logo -->
      <div class="splash-logo-wrapper">
        <div class="splash-logo-glow"></div>
        <div class="splash-logo gradient-text logo-bounce" aria-label="Planet 2048">
          PLANET<br>2048
        </div>
      </div>

      <!-- Decorative merge concept -->
      <div aria-hidden="true" style="display:flex;gap:8px;margin-bottom:6px;margin-top:-4px;align-items:center;">
        <span style="background:rgba(168,216,234,0.15);border:1.5px solid rgba(168,216,234,0.4);border-radius:10px;padding:4px 10px;font-size:0.85rem;font-weight:900;color:#A8D8EA;">☄️</span>
        <span style="background:rgba(0,212,255,0.12);border:1.5px solid rgba(0,212,255,0.3);border-radius:10px;padding:4px 8px;font-size:0.85rem;font-weight:900;color:#00D4FF;">+</span>
        <span style="background:rgba(168,216,234,0.15);border:1.5px solid rgba(168,216,234,0.4);border-radius:10px;padding:4px 10px;font-size:0.85rem;font-weight:900;color:#A8D8EA;">☄️</span>
        <span style="background:rgba(0,212,255,0.12);border:1.5px solid rgba(0,212,255,0.3);border-radius:10px;padding:4px 8px;font-size:0.85rem;font-weight:900;color:#00D4FF;">=</span>
        <span style="background:rgba(113,121,126,0.15);border:1.5px solid rgba(113,121,126,0.4);border-radius:10px;padding:4px 10px;font-size:0.85rem;font-weight:900;color:#71797E;">🪨</span>
      </div>

      <!-- Subtitle -->
      <p class="splash-subtitle">같은 행성을 합쳐 은하를 만들어라!</p>

      <!-- CTA button -->
      <button
        id="btn-start"
        class="tap-to-start"
        aria-label="게임 시작"
        onclick="window.__startGame && window.__startGame()"
      >
        TAP TO START
      </button>

      <!-- How-to hint -->
      <p style="margin-top:18px;font-size:0.72rem;color:var(--color-text-muted);letter-spacing:0.05em;text-align:center;max-width:240px;line-height:1.6;">
        터치해서 행성을 떨어뜨려요 · 같은 행성끼리 합체!
      </p>

    </div>

    <!-- Version -->
    <span class="splash-version">v1.0.0</span>

  </div>

  <!-- ════════════════════════════════════════════════════
       GAME SCREEN
  ═════════════════════════════════════════════════════ -->
  <div id="game-screen" class="screen hidden" style="justify-content:flex-start;align-items:center;">

    <!-- ── Top HUD ── -->
    <div id="game-hud">

      <!-- Score = highest ball (left) -->
      <div class="hud-score-block">
        <span class="hud-label">최고</span>
        <span id="hud-score">0</span>
      </div>

      <!-- Combo (center) -->
      <div id="hud-combo-block">
        <span id="hud-combo" class="combo-0"></span>
        <span id="hud-combo-label">콤보</span>
      </div>

      <!-- Next ball preview -->
      <div style="display:flex;flex-direction:column;align-items:center;min-width:50px;">
        <span class="hud-label">다음</span>
        <div id="hud-next-ball">1</div>
        <span id="hud-next-name" style="font-size:0.5rem;color:var(--color-text-muted);margin-top:1px;white-space:nowrap;"></span>
      </div>

      <!-- Pause button (right) -->
      <button id="btn-pause" aria-label="일시정지">
        <i data-lucide="pause" style="width:18px;height:18px;"></i>
      </button>

    </div>

    <!-- ── Canvas Container ── -->
    <div id="canvas-container">

      <!-- Physics canvas -->
      <canvas id="game-canvas" aria-label="게임 화면"></canvas>

      <!-- Danger zone line -->
      <div id="danger-line" aria-hidden="true"></div>

    </div>

    <!-- ── Ad Banner (320×50) — 주석처리: 추후 광고 삽입 시 복원 ── -->
    <!--
    <div id="ad-banner" aria-label="광고 배너">
      <span class="text-gray-600 text-xs" style="letter-spacing:0.1em;">AD SPACE · 320×50</span>
    </div>
    -->

  </div>

  <!-- ════════════════════════════════════════════════════
       GAME OVER SCREEN
  ═════════════════════════════════════════════════════ -->
  <div id="gameover-screen" class="screen hidden">

    <!-- Starfield (reused) -->
    <div class="stars-bg" id="stars-bg-gameover" aria-hidden="true"></div>

    <div class="gameover-card">

      <!-- Title -->
      <div class="gameover-title gradient-text">GAME OVER</div>
      <p class="gameover-subtitle">행성이 위험선을 넘었어요!</p>

      <!-- Final Score -->
      <div class="score-display-block">
        <span class="score-display-label">최고 행성</span>
        <span id="final-score" class="score-display-value gradient-text">0</span>
      </div>

      <!-- Best Score -->
      <div class="best-display-block">
        <span class="best-label">최고 기록</span>
        <span id="best-score" class="best-value">0</span>
      </div>

      <!-- Action Buttons -->
      <div class="gameover-actions">

        <!-- Reward ad continue button -->
        <button
          id="btn-continue-ad"
          class="btn-primary btn-ad"
          aria-label="광고 보고 이어하기"
          onclick="window.__continueWithAd && window.__continueWithAd()"
        >
          <i data-lucide="play-circle" style="width:18px;height:18px;flex-shrink:0;"></i>
          <span>
            이어하기 (광고)
            <span class="btn-ad-label">30초 광고 시청 후 계속</span>
          </span>
        </button>

        <!-- Restart button -->
        <button
          id="btn-restart"
          class="btn-secondary"
          aria-label="다시하기"
          onclick="window.__restartGame && window.__restartGame()"
        >
          <i data-lucide="refresh-cw" style="width:16px;height:16px;flex-shrink:0;"></i>
          다시하기
        </button>

      </div>

    </div>

  </div>

  <!-- ════════════════════════════════════════════════════
       PAUSE MODAL
  ═════════════════════════════════════════════════════ -->
  <div id="pause-modal" class="hidden" role="dialog" aria-modal="true" aria-label="일시정지">

    <div class="pause-card">

      <div class="pause-title gradient-text-cyan">PAUSED</div>

      <div class="pause-actions">

        <!-- Resume -->
        <button
          id="btn-resume"
          class="btn-primary"
          aria-label="계속하기"
        >
          <i data-lucide="play" style="width:18px;height:18px;"></i>
          계속하기
        </button>

        <!-- Sound toggle -->
        <button
          id="btn-sound"
          class="btn-sound-toggle"
          aria-label="사운드 토글"
        >
          <i id="sound-icon" data-lucide="volume-2" style="width:17px;height:17px;"></i>
          <span id="sound-label">사운드 ON</span>
        </button>

        <!-- Restart from pause -->
        <button
          id="btn-pause-restart"
          class="btn-secondary"
          aria-label="처음부터 다시하기"
        >
          <i data-lucide="refresh-cw" style="width:16px;height:16px;flex-shrink:0;"></i>
          처음부터
        </button>

      </div>

    </div>

  </div>

       SCRIPTS (deferred)
  ═════════════════════════════════════════════════════ -->
  <script defer src="js/game.js?v=7"></script>
  <script defer src="js/planets.js?v=7"></script>
  <script defer src="js/drop.js?v=7"></script>
  <script defer src="js/effects.js?v=7"></script>
  <script defer src="js/ui.js?v=7"></script>
  <script defer src="js/index.js?v=7"></script>

  <!-- Inline bootstrap (runs after all deferred scripts) -->
  <script>
    /* ── Starfield generator ───────────────────────────── */
    function generateStars(containerId, count) {
      var container = document.getElementById(containerId);
      if (!container) return;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < count; i++) {
        var star = document.createElement('div');
        star.className = 'star';
        var x   = Math.random() * 100;
        var y   = Math.random() * 100;
        var dur = (2 + Math.random() * 4).toFixed(2);
        var del = (Math.random() * 5).toFixed(2);
        var sz  = Math.random() > 0.85 ? 3 : 2;
        star.style.cssText =
          'left:' + x + '%;top:' + y + '%;' +
          'width:' + sz + 'px;height:' + sz + 'px;' +
          'animation-duration:' + dur + 's;' +
          'animation-delay:-' + del + 's;';
        frag.appendChild(star);
      }
      container.appendChild(frag);
    }

    generateStars('stars-bg', 80);
    generateStars('stars-bg-gameover', 60);

    /* ── Lucide icon init (after DOM ready) ────────────── */
    document.addEventListener('DOMContentLoaded', function () {
      if (window.lucide) {
        lucide.createIcons();
      }
    });

    /* ── Loading bar simulation ────────────────────────── */
    (function () {
      var bar = document.getElementById('loading-bar');
      var pct = 0;
      var iv  = setInterval(function () {
        pct += Math.random() * 18;
        if (pct >= 90) { clearInterval(iv); pct = 90; }
        bar.style.width = pct + '%';
      }, 120);
      window.addEventListener('load', function () {
        clearInterval(iv);
        bar.style.width = '100%';
        setTimeout(function () { bar.style.opacity = '0'; }, 400);
      });
    })();
  </script>

</body>
